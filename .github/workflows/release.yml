name: Release Vyon

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Generate icons (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/icons
          pip install Pillow
          python3 - << 'PYEOF'
          from PIL import Image
          import os
          src = "src-tauri/icons/app-icon.png"
          img = Image.open(src).convert("RGBA") if os.path.exists(src) else Image.new("RGBA", (512,512), (10,10,20,255))
          img.resize((32,32), Image.LANCZOS).save("src-tauri/icons/32x32.png")
          img.resize((128,128), Image.LANCZOS).save("src-tauri/icons/128x128.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/128x128@2x.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.icns")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.ico")
          print("Icons done")
          PYEOF

      - name: Generate icons (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/icons
          pip3 install Pillow --break-system-packages
          python3 - << 'PYEOF'
          from PIL import Image
          import os
          src = "src-tauri/icons/app-icon.png"
          img = Image.open(src).convert("RGBA") if os.path.exists(src) else Image.new("RGBA", (512,512), (10,10,20,255))
          img.resize((32,32), Image.LANCZOS).save("src-tauri/icons/32x32.png")
          img.resize((128,128), Image.LANCZOS).save("src-tauri/icons/128x128.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/128x128@2x.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.icns")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.ico")
          print("Icons done")
          PYEOF

      - name: Generate icons (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p src-tauri/icons
          pip install Pillow
          python3 - << 'PYEOF'
          from PIL import Image
          import os
          src = "src-tauri/icons/app-icon.png"
          img = Image.open(src).convert("RGBA") if os.path.exists(src) else Image.new("RGBA", (512,512), (10,10,20,255))
          img.resize((32,32), Image.LANCZOS).save("src-tauri/icons/32x32.png")
          img.resize((128,128), Image.LANCZOS).save("src-tauri/icons/128x128.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/128x128@2x.png")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.icns")
          img.resize((256,256), Image.LANCZOS).save("src-tauri/icons/icon.ico")
          print("Icons done")
          PYEOF
        shell: bash

      - name: Fix reports.rs
        run: |
          python3 -c "
          content = open('src-tauri/src/reports.rs').read()
          content = content.replace('use crate::types::{Finding, ReportData, Severity};', 'use crate::types::{ReportData, Severity};')
          open('src-tauri/src/reports.rs', 'w').write(content)
          print('Fixed')
          "
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Vyon ${{ github.ref_name }}
          releaseBody: |
            ## Vyon Web3 Security Scanner

            ### Download
            - **Windows** → `.exe`
            - **macOS** → `.dmg`
            - **Linux** → `.AppImage`

            ### After installing
             pip install slither-analyzer mythril
             releaseDraft: false
             prerelease: false
